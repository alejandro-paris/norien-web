        - list [ref=e492]:
          - listitem [ref=e493]:
            - text: "◊ Financiación flexible Condiciones de la financiación flexible: La financiación para particulares de la tienda online de Apple es un servicio organizado y gestionado por Apple Distribution International Limited, Hollyhill Industrial Estate, Cork, Irlanda, que actúa como intermediario de crédito (no exclusivamente) y no como entidad crediticia. Apple ofrece financiación por parte de un número limitado de proveedores, entre ellos Banco Cetelem S.A.U., Paseo de los Melancólicos, 14A, 28005-MADRID (que opera bajo el nombre Cetelem). Oferta sujeta a solicitud, estado y requisitos."
            - link "Consulta las condiciones" [ref=e494] [cursor=pointer]:
              - /url: /es/shop/browse/financing/terms
            - text: . Si se aprueba tu solicitud, se te puede ofrecer un préstamo con pago a plazos o una línea de crédito en función de los productos que hayas seleccionado. La línea de crédito es flexible, de modo que, una vez abierta, se puede reutilizar para hacer más compras a Apple y elegir la duración de las cuotas en función de la disponibilidad y la solicitud. Más información en
            - link "apple.com/es/shop/browse/financing/terms" [ref=e495] [cursor=pointer]:
              - /url: /es/shop/browse/financing/terms
            - text: . Los productos y las ofertas de financiación disponibles en la tienda pueden variar. Las ofertas disponibles con financiación flexible están sujetas a cambios. Las ofertas que se muestran actualmente solo están disponibles para clientes que realizan una compra válida en el Apple Store para particulares. Se aplica un límite mínimo de transacción de 150 € y un límite máximo de 4.000 €. Renovación de tu dispositivo con la financiación flexible Tu valor de renovación se puede aplicar a la compra de un nuevo dispositivo válido o a la liquidación del plan que tengas asociado. El valor real reconocido se basa en la recepción de un dispositivo válido que coincida con la descripción proporcionada durante la estimación. Si no envías tu dispositivo de renovación en un plazo de 14 días o decides aceptar una estimación modificada del valor de renovación, Cetelem añadirá un saldo extra a tu línea de crédito de la financiación flexible u otro préstamo con pago a plazos (dependiendo de tu plan de financiación flexible actual) que ajustará las cuotas mensuales teniendo en cuenta el coste íntegro sin el valor de renovación o bien el valor de renovación modificado. Si prefieres utilizar el valor de renovación para liquidar tu plan de financiación, se aplicará a tu plan actual de cuotas mensuales, y cualquier cantidad sobrante se descontará de tu nuevo dispositivo. Si el valor de renovación estimado o un valor de renovación revisado es inferior a tu saldo restante, tendrás que pagar las cuotas mensuales que queden del plan de financiación actual.
          - listitem [ref=e496]:
            - text: "* Los valores de renovación dependen del estado, el año y la configuración de tu dispositivo de renovación válido y el país/región en el que se vendió originalmente. Para poder cambiar tu dispositivo por un descuento o una Apple Gift Card, tienes que ser mayor de edad. No todos los dispositivos pueden acogerse a esta oferta. La entrega de ordenadores de mesa solo puede tramitarse por internet en estos momentos. Para obtener más información sobre los dispositivos válidos y su reciclaje, consulta a nuestro"
            - link "socio" [ref=e497] [cursor=pointer]:
              - /url: https://es-appletradein.likewize.com/
            - text: . Puede haber restricciones y limitaciones. El pago dependerá de que el estado del dispositivo coincida con el indicado durante la tasación. Apple se reserva el derecho a rechazar o limitar la cantidad de dispositivos según su criterio. El valor de tu dispositivo se descontará del precio del producto Apple nuevo. Esta oferta puede no estar disponible en todas las tiendas. Algunas tiendas pueden exigir más requisitos.
        - list [ref=e498]:
          - listitem [ref=e499]: En comparación con la generación anterior de iPhone.
          - listitem [ref=e500]: El iPhone Duo, iPhone 18 Pro, iPhone 17e, iPhone 17 y iPhone Air son resistentes a las salpicaduras, el agua y el polvo. Las pruebas se han realizado bajo control en un laboratorio y todos los modelos han obtenido la calificación IP68 según la norma IEC 60529 (hasta 6 metros de profundidad durante un máximo de 30 minutos). La resistencia a las salpicaduras, el agua y el polvo no es permanente y puede disminuir como consecuencia del uso habitual. No intentes cargar el iPhone si está mojado. Consulta el manual de uso antes de limpiarlo o secarlo. La garantía no cubre los daños producidos por líquidos.
          - listitem [ref=e501]:
            - text: Apple Intelligence está disponible con el idioma de Siri y el dispositivo configurados en alemán, chino (simplificado o tradicional), coreano, danés, español, francés, inglés, italiano, japonés, neerlandés, noruego, portugués, sueco, turco o vietnamita. Algunas prestaciones no están disponibles en todas las regiones o idiomas. Algunos dispositivos no están disponibles en todas las regiones. Por ahora, Siri AI no estará disponible en iOS 27 en la UE. Algunas prestaciones de Apple Intelligence que utilizan modelos basados en servidores están sujetas a límites de uso diario, incluyendo, entre otras, las herramientas inteligentes de edición de fotos, Image Playground y los modelos de AFM 3 Cloud en Atajos. Los límites diarios pueden variar según la prestación, la complejidad de la solicitud, la demanda del sistema, las políticas del sistema y otros factores. En el futuro, el acceso ampliado a estas prestaciones estará sujeto a un cargo. El uso de estas prestaciones está sujeto a los términos y condiciones de Apple Intelligence. Más información en
